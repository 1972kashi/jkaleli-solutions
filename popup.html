<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What can we do for you?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="page">
    <div class="overlay"></div>

    <div class="popup">

      <!-- Header -->
      <div class="header">
        <h2 class="title">What can we do for<br />you?</h2>
      </div>

      <!-- Filters -->
      <div class="filter-row">
        <span class="filter-label">I am a</span>
        <div class="select-wrap">
          <select id="role-select" class="select">
            <option value=""></option>
            <option value="Developer">Developer</option>
            <option value="Designer">Designer</option>
            <option value="Marketer">Marketer</option>
            <option value="Business Owner">Business Owner</option>
            <option value="Student">Student</option>
            <option value="Freelancer">Freelancer</option>
          </select>
          <span class="select-arrow">▾</span>
        </div>
        <span class="filter-label">I want to</span>
        <div class="select-wrap">
          <select id="want-select" class="select">
            <option value=""></option>
            <option value="Build a Website">Build a Website</option>
            <option value="Create an App">Create an App</option>
            <option value="Get a Design">Get a Design</option>
            <option value="Scale My Business">Scale My Business</option>
            <option value="Learn New Skills">Learn New Skills</option>
            <option value="Find a Partner">Find a Partner</option>
          </select>
          <span class="select-arrow">▾</span>
        </div>
      </div>

      <!-- Reset -->
      <div class="reset-row">
        <button id="reset-btn" class="reset-btn">Reset Filter</button>
      </div>

      <!-- Card Carousel -->
      <div class="carousel-row">
        <button id="prev-btn" class="arrow-btn">&#8249;</button>

        <div class="card" id="card">
          <div class="card-icon" id="card-icon">{ }</div>
          <div class="card-title" id="card-title">Custom Development</div>
          <p class="card-desc" id="card-desc">From custom applications to complex systems, we build scalable and secure solutions tailored to your business needs.</p>
          <div class="dots" id="dots"></div>
        </div>

        <button id="next-btn" class="arrow-btn">&#8250;</button>
      </div>

      <!-- Submit -->
      <div class="submit-row">
        <button id="submit-btn" class="submit-btn">SUBMIT</button>
      </div>

    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
